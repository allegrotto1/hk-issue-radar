<p id="b">載入議題快報…</p>
<script>
(async () => {
  const n = 40;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const r = await fetch('./' + i + '.b64', {cache: 'no-cache'});
    if (!r.ok) throw new Error(i + '.b64 ' + r.status);
    parts.push((await r.text()).trim());
  }
  const bin = atob(parts.join(''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const html = new TextDecoder('utf-8').decode(bytes);
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.getElementById('b').textContent = '載入失敗：' + e;
});
</script>
