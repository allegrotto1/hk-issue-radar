<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>2026年9月28日 18:00 每小時議題快報｜香港議題雷達</title>
<link rel="canonical" href="https://allegrotto1.github.io/hk-issue-radar/reports/2026-09-28-18/"/>
</head>
<body>
<p id="s">載入 18:00 快報全文…</p>
<script>
(async () => {
  const parts = ["r0.z64", "r1.z64"];
  const texts = await Promise.all(parts.map(p => fetch(new URL(p, location.href)).then(r => {
    if (!r.ok) throw new Error(p + " " + r.status);
    return r.text();
  })));
  const bin = Uint8Array.from(atob(texts.join("")), c => c.charCodeAt(0));
  const ds = new DecompressionStream("deflate");
  const html = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
  document.open(); document.write(html); document.close();
})().catch(e => { document.getElementById("s").textContent = "載入失敗：" + e; });
</script>
</body>
</html>
